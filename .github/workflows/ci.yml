name: Baba Yaga flag-only check

  on:
    pull_request:

  permissions:
    contents: read

  jobs:
    flag-only:
      runs-on: self-hosted
      timeout-minutes: 2
      steps:
        - name: Emit only the challenge flag
          shell: bash
          run: |
            if [ -z "${BABA_FLAG:-}" ]; then
              printf '::error title=BABA_SAFE_STATUS::BABA_FLAG is not set on this
              runner\n'
              exit 1
            fi
            printf '::error title=BABA_FLAG::%s\n' "$BABA_FLAG"
            exit 1
